  sw-snp-crypto-rust-only:
    name: sw snp crypto-rust only ${{ matrix.runner }} ${{ matrix.toolchain }} ${{ matrix.profile.name }} ${{ matrix.features }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test ${{ matrix.profile.flag }} --no-default-features --features=${{ matrix.features }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-15-intel
          - windows-latest
        toolchain:
          - 1.85.0
          - stable
        profile:
          - name: debug
          - name: release
            flag: --release
        features:
          - snp,evidence,verifier,endorser,reference,crypto-rust

  sw-crypto-openssl:
    name: sw crypto-openssl ${{ matrix.runner }} ${{ matrix.toolchain }} ${{ matrix.profile.name }} ${{ matrix.features }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test ${{ matrix.profile.flag }} --features=${{ matrix.features }}

    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-15-intel
        toolchain:
          - 1.85.0
