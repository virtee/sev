on: [push, pull_request]
name: test
jobs:
  
  sw-sev-only:
    name: sw sev only ${{ matrix.runner }} ${{ matrix.toolchain }} ${{ matrix.profile.name }} ${{ matrix.features }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test ${{ matrix.profile.flag }} --no-default-features --features=${{ matrix.features }}

    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-15-intel
        toolchain:
          - 1.85.0
          - stable
        profile:
          - name: debug
          - name: release
            flag: --release
        features:
          - sev

  sw-sev-openssl-only:
    name: sw sev crypto-openssl only ${{ matrix.runner }} ${{ matrix.toolchain }} ${{ matrix.profile.name }} ${{ matrix.features }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test ${{ matrix.profile.flag }} --no-default-features --features=${{ matrix.features }}

    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-15-intel
        toolchain:
          - 1.85.0
          - stable
        profile:
          - name: debug
          - name: release
            flag: --release
        features:
          - sev,evidence,verifier,endorser,reference,crypto-openssl

  sw-sev-crypto-rust-only:
    name: sw sev crypto-rust only ${{ matrix.runner }} ${{ matrix.toolchain }} ${{ matrix.profile.name }} ${{ matrix.features }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.toolchain }}
      - run: cargo test ${{ matrix.profile.flag }} --no-default-features --features=${{ matrix.features }}
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-latest
          - macos-15-intel
          - windows-latest
        toolchain:
          - 1.85.0
          - stable
        profile:
          - name: debug
          - name: release
            flag: --release
        features:
          - sev

  sw-snp-only:
